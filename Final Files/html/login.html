<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo-container">
                <img src="../images/logo.jpg" alt="StudentHub Portal Logo">
                <h1>StudentHub Portal</h1>
            </div>
            <div class="header-actions">
                <button id="notificationButton" class="icon-button" type="button" aria-label="View notifications">🔔 <span id="notificationCount">3</span></button>
                <button id="themeButton" class="icon-button" type="button" aria-label="Switch to dark mode">🌙</button>
                <button id="menuButton" class="menu-button" type="button" aria-controls="navMenu" aria-expanded="false" aria-label="Open navigation menu">☰</button>
            </div>
        </div>
        <nav id="navMenu" aria-label="Main Navigation">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="login.html">Login</a>
            <a class="nav-link" href="register.html">Register</a>
            <a class="nav-link" href="dashboard.php">Dashboard</a>
            <a class="nav-link" href="courses.html">Courses</a>
            <a class="nav-link" href="attendance.html">Attendance</a>
            <a class="nav-link" href="assignments.html">Assignments</a>
            <a class="nav-link" href="results.html">Results</a>
            <a class="nav-link" href="profile.html">Profile</a>
            <a class="nav-link" href="contact.html">Contact</a>
            <a class="nav-link" href="events.html">Events</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>StudentHub Login</h2>
            <p id="loginMessage" class="error-message" role="alert" aria-live="polite"></p>
            <form id="loginForm" action="../php/login.php" method="POST">
                <p>
                    <label for="studentId">Student ID:</label>
                    <input type="text" id="studentId" name="studentId" required autocomplete="username">
                </p>
                <p>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </p>
                <p><button type="submit">Login</button></p>
            </form>
            <p>New student? <a href="register.html">Register here</a></p>
        </section>
    </main>

    <aside>
        <h2>Quick Information</h2>
        <p>Login to access your StudentHub portal.</p>
    </aside>

    <footer>
        <p>&copy; <span id="currentYear">2026</span> StudentHub Portal</p>
    </footer>

    <script src="../js/script.js"></script>
    <script>
        // Display a friendly message returned by the PHP login processor.
        const messages = {
            invalid: "Invalid Student ID or password. Please try again.",
            required: "Please enter both Student ID and password.",
            database: "Unable to process login right now. Please try again later.",
            logout: "You have been logged out successfully.",
            timeout: "Your session expired due to inactivity. Please log in again.",
            denied: "You do not have permission to access that page."
        };
        const key = new URLSearchParams(window.location.search).get("message");
        const messageBox = document.getElementById("loginMessage");
        if (key && messages[key]) {
            messageBox.textContent = messages[key];
            messageBox.style.display = "block";
        } else {
            messageBox.style.display = "none";
        }
    </script>
</body>
</html>
