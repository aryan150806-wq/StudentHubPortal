<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Register</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo-container">
                <img src="../images/logo.jpg" alt="StudentHub Portal Logo">
                <h1>StudentHub Portal</h1>
            </div>
            <div class="header-actions">
                <button id="notificationButton" class="icon-button" type="button" aria-label="View notifications">🔔 <span id="notificationCount">3</span></button>
                <button id="themeButton" class="icon-button" type="button" aria-label="Switch to dark mode">🌙</button>
                <button id="menuButton" class="menu-button" type="button" aria-controls="navMenu" aria-expanded="false" aria-label="Open navigation menu">☰</button>
            </div>
        </div>
        <nav id="navMenu" aria-label="Main Navigation">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="login.html">Login</a>
            <a class="nav-link" href="register.html">Register</a>
            <a class="nav-link" href="dashboard.html">Dashboard</a>
            <a class="nav-link" href="courses.html">Courses</a>
            <a class="nav-link" href="attendance.html">Attendance</a>
            <a class="nav-link" href="assignments.html">Assignments</a>
            <a class="nav-link" href="results.html">Results</a>
            <a class="nav-link" href="profile.html">Profile</a>
            <a class="nav-link" href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
<h2>Create Student Account</h2>
<form id="registerForm" action="#" method="post">
<p><label for="name">Full Name:</label>
<input type="text" id="name" name="name" required></p>
<p><label for="studentId">Student ID:</label>
<input type="text" id="studentId" name="studentId" required></p>
<p><label for="email">Email:</label>
<input type="email" id="email" name="email" required></p>
<p><label for="phone">Phone:</label>
<input type="tel" id="phone" name="phone"></p>
<p><label for="program">Program:</label>
<select id="program" name="program">
<option>B.Tech</option><option>BCA</option><option>MCA</option>
</select></p>
<p><label for="semester">Semester:</label>
<input type="number" id="semester" name="semester" min="1" max="8"></p>
<p><label for="password">Password:</label>
<input type="password" id="password" name="password" required></p>
<p><button type="submit">Create Account</button></p>
</form>
<p>Already have an account? <a href="login.html">Login</a></p>
</section>
    </main>

    <aside>
        <h2>Quick Information</h2>
        <p>Welcome to the StudentHub student portal.</p>
    </aside>

    <footer>
        <p>&copy; <span id="currentYear">2026</span> StudentHub Portal</p>
    </footer>
    <script src="../js/script.js"></script>
</body>
</html>
