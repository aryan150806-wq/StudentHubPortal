    <main>
        <section>
<h2>Create Student Account</h2>
<form action="#" method="post">
<p><label for="name">Full Name:</label>
<input type="text" id="name" name="name" required></p>
<p><label for="studentId">Student ID:</label>
<input type="text" id="studentId" name="studentId" required></p>
<p><label for="email">Email:</label>
<input type="email" id="email" name="email" required></p>
<p><label for="phone">Phone:</label>
<input type="tel" id="phone" name="phone"></p>
<p><label for="program">Program:</label>
<select id="program" name="program">
<option>B.Tech</option><option>BCA</option><option>MCA</option>
</select></p>
<p><label for="semester">Semester:</label>
<input type="number" id="semester" name="semester" min="1" max="8"></p>
<p><label for="password">Password:</label>
<input type="password" id="password" name="password" required></p>
<p><button type="submit">Create Account</button></p>
</form>
<p>Already have an account? <a href="login.html">Login</a></p>
</section>
    </main>
